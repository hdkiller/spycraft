name: Build & Release SpyCraft

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle Wrapper Executable
        run: chmod +x spycraft/gradlew

      - name: Run Tests
        run: |
          cd spycraft
          ./gradlew test

      - name: Build Mod JAR
        run: |
          cd spycraft
          ./gradlew build

      - name: Locate Built Artifacts
        id: artifacts
        run: |
          JAR_FILE=$(ls spycraft/build/libs/spycraft-*.jar | grep -v 'sources' | head -n 1)
          echo "Found JAR: $JAR_FILE"
          echo "jar_path=$JAR_FILE" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: ${{ steps.artifacts.outputs.jar_path }}
          name: SpyCraft ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
